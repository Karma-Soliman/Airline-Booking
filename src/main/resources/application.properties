spring.application.name=airline

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/timeout_airline
spring.datasource.username=postgres
spring.datasource.password=peushi
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080


#enable cors
spring.web.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:5500
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

